name: Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for  manual build'
        required: false
        default: 'dev'
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version string
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version }}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Decrypt fonts
        env:
          FONT_ARCHIVE_PASSPHRASE: ${{ secrets.FONT_ARCHIVE_PASSPHRASE }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in fonts.tar.xz.enc -out fonts.tar.xz \
            -pass env:FONT_ARCHIVE_PASSPHRASE
          tar -xJf fonts.tar.xz
          rm fonts.tar.xz

      - name: Build with TeX Live (lualatex)
        uses: xu-cheng/texlive-action@v3
        with:
          scheme: full
          run: |
            apk add --no-cache zip
            chmod +x build.sh
            ./build.sh "${{ steps.version.outputs.value }}"

      - name: Remove decrypted fonts
        if: always()
        run: rm -rf ./Fonts

      - name: Attach zip to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/ugentdocs-${{ steps.version.outputs.value }}.zip

      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ugentdocs-${{ steps.version.outputs.value }}
          path: build/ugentdocs-${{ steps.version.outputs.value }}.zip
