name: Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for manual build (leave empty for dev-<hash>)'
        required: false
        default: ''
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history and tags for CHANGELOG.md

      - name: Determine version string
        id: version
        run: |
          # Empty means: let build.lua use the Git tag or dev-<hash>
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Decrypt fonts
        env:
          FONT_ARCHIVE_PASSPHRASE: ${{ secrets.FONT_ARCHIVE_PASSPHRASE }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in fonts.tar.xz.enc -out fonts.tar.xz \
            -pass env:FONT_ARCHIVE_PASSPHRASE
          tar -xJf fonts.tar.xz
          rm fonts.tar.xz

      - name: Build with TeX Live (l3build)
        uses: xu-cheng/texlive-action@v3
        with:
          scheme: full
          run: |
            apk add --no-cache git
            git config --global --add safe.directory "$PWD"
            V="${{ steps.version.outputs.value }}"
            l3build release $V
            l3build ctan $V

      - name: Remove decrypted fonts
        if: always()
        run: rm -rf ./Fonts

      - name: Attach zips to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ugentdocs-*.zip

      - name: Upload build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ugentdocs-build
          path: ugentdocs-*.zip
